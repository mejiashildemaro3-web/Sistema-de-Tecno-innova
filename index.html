<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tecno-Innova C.A. | Ingreso de Pedidos</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome para Íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Enlace al archivo CSS externo -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Panel de opciones izquierdo -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <i class="fa-solid fa-shield-halved"></i>
            <h2>Tecno-Innova</h2>
        </div>
        <ul class="nav-menu">
            <a href="#" class="nav-item active">
                <i class="fa-solid fa-cart-plus"></i><span>Nuevo Pedido</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fa-solid fa-list-check"></i><span>Gestión de Pedidos</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fa-solid fa-helmet-safety"></i><span>Órdenes & Técnicos</span>
            </a>
        </ul>
    </aside>

    <!-- Contenido Principal -->
    <main class="main-content">
        <header class="topbar">
            <div class="title">Ingreso de Nuevo Pedido</div>
            <div class="user-profile">
                <span>Ventas Web</span>
                <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
            </div>
        </header>

        <div class="container">
            <!-- Contenedor de Alertas -->
            <div id="alertBox" class="alert">
                <i id="alertIcon" class="fa-solid fa-circle-check"></i>
                <span id="alertMessage"></span>
            </div>

            <!-- Tarjeta del Formulario -->
            <div class="card">
                <div class="card-header">
                    <h3>Registro de Cliente y Validación</h3>
                    <p>Los datos registrados se conectarán directamente con Supabase para su validación en el sistema.</p>
                </div>

                <form id="pedidoForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="numeroDocumento">Documento de Identidad / RIF *</label>
                            <div class="doc-group">
                                <select id="tipoDocumento" required>
                                    <option value="V">V</option>
                                    <option value="J">J</option>
                                    <option value="E">E</option>
                                    <option value="G">G</option>
                                </select>
                                <input type="text" id="numeroDocumento" placeholder="Ej. 12345678" required style="flex: 1;">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="nombreRazonSocial">Nombre / Razón Social *</label>
                            <input type="text" id="nombreRazonSocial" placeholder="Nombre completo o empresa" required>
                        </div>
                        <div class="form-group">
                            <label for="telefono">Teléfono de Contacto *</label>
                            <input type="tel" id="telefono" placeholder="Ej. 0414-1234567" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Correo Electrónico *</label>
                            <input type="email" id="email" placeholder="correo@ejemplo.com" required>
                        </div>
                        <div class="form-group full-width">
                            <label for="direccion">Dirección de Instalación *</label>
                            <textarea id="direccion" rows="2" placeholder="Detalle la dirección exacta..." required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="zonaGeograficaId">Zona Geográfica *</label>
                            <select id="zonaGeograficaId" required>
                                <option value="" disabled selected>Cargando zonas desde la base de datos...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="origenPedido">Origen del Pedido *</label>
                            <select id="origenPedido" required>
                                <option value="llamada">Llamada Telefónica</option>
                                <option value="web">Formulario Web</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" class="btn btn-outline" onclick="document.getElementById('pedidoForm').reset();">
                            <i class="fa-solid fa-eraser"></i> Limpiar
                        </button>
                        <button type="submit" class="btn btn-primary" id="btnSubmit">
                            <i class="fa-solid fa-save"></i> Registrar Pedido
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Enlace al archivo JavaScript externo -->
    <script src="app.js"></script>
</body>
</html>
