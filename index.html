<!-- VISTA: Crear Factura -->
<section id="view-crear-factura" class="view-section" style="display: none;">
    <div class="dashboard-header-text">
        <h2>Generación de Nueva Factura</h2>
        <p>Registro fiscal conectado a tablas de Supabase</p>
    </div>
    <div class="card form-card">
        <form id="form-crear-factura" onsubmit="guardarFactura(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label>Número de Factura</label>
                    <input type="text" id="fac-numero" value="FAC-2026-009" required>
                </div>
                <div class="form-group">
                    <label>Seleccionar Cliente Registrado</label>
                    <select id="fac-cliente-select" class="form-control" required style="padding:10px; border-radius:6px; border:1px solid var(--border-color);">
                        <option value="">Cargando clientes...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Descripción del Ítem / Servicio</label>
                    <input type="text" id="fac-descripcion" placeholder="Ej. Instalación de sistema biométrico" required>
                </div>
                <div class="form-group">
                    <label>Cantidad</label>
                    <input type="number" id="fac-cantidad" value="1" min="1" required oninput="calcularTotalFactura()">
                </div>
                <div class="form-group">
                    <label>Precio Unitario ($)</label>
                    <input type="number" step="0.01" id="fac-precio" placeholder="0.00" required oninput="calcularTotalFactura()">
                </div>
                <div class="form-group">
                    <label>Subtotal ($)</label>
                    <input type="text" id="fac-subtotal-calc" readonly value="$0.00" style="background:#f1f5f9;">
                </div>
                <div class="form-group">
                    <label>Impuestos / IVA (16%)</label>
                    <input type="text" id="fac-impuesto-calc" readonly value="$0.00" style="background:#f1f5f9;">
                </div>
                <div class="form-group">
                    <label>Monto Total a Pagar ($)</label>
                    <input type="text" id="fac-total-calc" readonly value="$0.00" style="background:#f1f5f9; font-weight:bold; color:var(--primary-blue);">
                </div>
            </div>
            <div class="action-bar" style="margin-top:20px;">
                <button type="submit" class="btn-primary"><i class="fa-solid fa-check"></i> Emitir Factura en Supabase</button>
            </div>
        </form>
    </div>
</section>
