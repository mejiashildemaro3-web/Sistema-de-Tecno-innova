<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Pedido | Tecno-Innova C.A.</title>
    
    <!-- Motor de Tailwind CSS para los estilos -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- Iconos de Google Material (opcional, si los usas en los botones) -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
</head>
<body class="bg-gray-50 text-gray-900 font-sans p-4 md:p-8">

    <!-- Contenedor Principal -->
    <main class="max-w-4xl mx-auto bg-white rounded-lg shadow-md overflow-hidden">
        
        <!-- Cabecera del Formulario -->
        <div class="px-6 py-4 border-b border-gray-200">
            <h2 class="text-xl font-semibold text-gray-800">Ingreso de Nuevo Pedido</h2>
        </div>

        <!-- Formulario de Datos -->
        <div class="p-6">
            <form id="form-pedido" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <!-- Campos del formulario con sus respectivos IDs -->
                <div>
                    <label class="block text-sm font-medium text-gray-700">Tipo de Documento *</label>
                    <select id="document_type" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                        <option value="V">V - Venezolano</option>
                        <option value="J">J - Jurídico</option>
                        <option value="G">G - Gubernamental</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Número de Documento *</label>
                    <input type="text" id="document_number" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Razón Social / Nombre *</label>
                    <input type="text" id="full_name" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Teléfono *</label>
                    <input type="tel" id="phone" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Correo Electrónico</label>
                    <input type="email" id="email" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Zona</label>
                    <input type="text" id="zone" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                </div>

                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700">Dirección Exacta *</label>
                    <textarea id="address" rows="2" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></textarea>
                </div>

                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700">Origen del Pedido</label>
                    <select id="source" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                        <option value="WhatsApp">WhatsApp</option>
                        <option value="Llamada">Llamada Telefónica</option>
                        <option value="Oficina">En Oficina</option>
                    </select>
                </div>
            </form>
        </div>

        <!-- Acciones / Botones -->
        <div class="px-6 py-4 bg-gray-50 border-t border-gray-200 flex flex-col-reverse sm:flex-row justify-end gap-3">
            <button id="btn-limpiar" class="px-6 py-2 border-2 border-blue-600 text-blue-600 hover:bg-blue-50 rounded-md font-medium transition-colors duration-200" type="button">
                Limpiar
            </button>
            <button id="btn-registrar" class="px-6 py-2 bg-blue-600 text-white hover:bg-blue-700 rounded-md font-medium shadow-sm flex items-center justify-center gap-2 transition-colors duration-200" type="button">
                <span class="material-symbols-outlined text-[18px]">check_circle</span>
                Registrar Pedido
            </button>
        </div>
    </main>

    <!-- Librerías Externas (Supabase y Alertas) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Tu archivo de lógica local -->
    <script src="app.js"></script>
</body>
</html>
