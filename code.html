<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tecno-innova - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                      "primary-fixed-dim": "#bec6e0",

                      "outline-variant": "#45464d",
                      "on-secondary-container": "#00424e",
                      "surface-dim": "#051424",
                      "surface-container-high": "#1c2b3c",
                      "on-tertiary-fixed-variant": "#004395",
                      "on-primary": "#283044",
                      "secondary-fixed-dim": "#4cd7f6",

              },
              "borderRadius": {

              },
              "spacing": {

                      "sm": "16px",
                      "xs": "8px",
                      "xl": "64px",
                      "md": "24px",
                      "gutter": "24px",
                      "margin-desktop": "48px",

<style>
        /* Ambient tech background */
        .tech-bg {
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(3, 181, 211, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(76, 215, 246, 0.05), transparent 25%);
        }
        
        /* Glassmorphism card */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Input focus glow */
        .glow-input:focus {
            border-color: #4cd7f6;
            box-shadow: 0 0 0 1px #4cd7f6, 0 0 8px rgba(76, 215, 246, 0.3);
            outline: none;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen font-body-md tech-bg flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop relative overflow-hidden">
<!-- Decorative Grid Background overlay -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-20" style="background-image: linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 24px 24px;"></div>
<main class="w-full max-w-md z-10">
<!-- Login Card -->
<div class="glass-panel rounded-xl shadow-2xl shadow-primary-container p-8 md:p-lg">
<!-- Header Area -->
<div class="text-center mb-xl">
<h1 class="font-headline-xl text-headline-xl text-on-surface mb-xs tracking-tighter">Tecno-innova</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Acceso al sistema central</p>
</div>
<!-- Login Form -->
<form class="space-y-md">
<!-- Username Input -->
<div class="space-y-base">
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest" for="username">
                        Nombre de usuario
                    </label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 transform -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">
                            person
                        </span>
<input class="w-full bg-surface-container border border-white/10 rounded-lg py-3 pl-10 pr-4 text-on-surface font-body-md text-body-md placeholder:text-on-surface-variant/50 transition-all duration-200 glow-input focus:bg-surface-container-high" id="username" name="username" placeholder="Ingresar usuario" required="" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-base">
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest" for="password">
                        Contraseña
                    </label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 transform -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">
                            lock
                        </span>
<input class="w-full bg-surface-container border border-white/10 rounded-lg py-3 pl-10 pr-4 text-on-surface font-body-md text-body-md placeholder:text-on-surface-variant/50 transition-all duration-200 glow-input focus:bg-surface-container-high" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Actions -->
<div class="pt-sm space-y-sm">
<button class="w-full bg-gradient-to-r from-secondary-container to-secondary text-on-secondary font-headline-lg-mobile text-headline-lg-mobile py-3 px-4 rounded-lg hover:opacity-90 transition-opacity active:scale-[0.98] duration-150 flex items-center justify-center gap-xs" type="submit">
                        Entrar
                        <span class="material-symbols-outlined text-on-secondary" style="font-variation-settings: 'FILL' 1;">
                            arrow_forward
                        </span>
</button>
<button class="w-full bg-transparent border border-white/10 text-on-surface-variant font-body-md text-body-md py-3 px-4 rounded-lg hover:bg-white/5 hover:text-on-surface transition-colors active:scale-[0.98] duration-150 flex items-center justify-center" type="button">
                        Cerrar
                    </button>
</div>
</form>
<!-- Footer Links -->
<div class="mt-lg text-center flex justify-center gap-md">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-secondary transition-colors underline-offset-4 hover:underline" href="#">Recuperar acceso</a>
<span class="text-on-surface-variant/30">•</span>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-secondary transition-colors underline-offset-4 hover:underline" href="#">Soporte</a>
</div>
</div>
</main>
<!-- Bottom ambient glow -->
<div class="absolute bottom-0 left-0 right-0 h-32 bg-gradient-to-t from-secondary/5 to-transparent z-0 pointer-events-none"></div>
</body></html>
